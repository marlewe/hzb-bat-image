[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-baseclasses @ git+https://github.com/nomad-hzb/nomad-baseclasses.git@v1.0.1",
  "nomad-lab[parsing,infrastructure]==2.0.0",
  "setuptools",
  "netcdf4==1.7.2",
]

[project.urls]
repository = "https://github.com/marlewe/hzb-bat-image"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-north-jupyter>=0.2.6",
  "nomad-north-voila>=0.1.15",
  "nomad-gui==2.0.0",
  "pynxtools==0.12.0",
  "pynxtools-apm>=0.4.2",
  "pynxtools-ellips>=0.1.1",
  "pynxtools-em>=0.4.2",
  "pynxtools-igor>=0.1.4",
  "pynxtools-mpes>=0.2.6",
  "pynxtools-raman>=0.1.1",
  "pynxtools-spm>=0.2.1",
  "pynxtools-xps>=0.5.4",
  "pynxtools-xrd>=0.0.7",
  "nomad-schema-plugin-run>=1.0.5",
  "nomad-schema-plugin-simulation-workflow>=1.0.11",
  "nomad-normalizer-plugin-bandstructure>=1.0.4",
  "nomad-normalizer-plugin-dos>=1.0.7",
  "nomad-normalizer-plugin-soap>=1.0.2",
  "nomad-normalizer-plugin-spectra>=1.0.4",
  "nomad-normalizer-plugin-system>=1.0.5",
  "nomad-normalizer-plugin-simulation-workflow>=1.0.5",
  "eelsdbconverter @ git+https://github.com/nomad-coe/nomad-parser-eelsdb.git@entry-point",
  "nomad-parser-plugins-electronic>=1.1.0",
  "nomad-parser-plugins-atomistic>=1.0.14",
  "nomad-parser-plugins-workflow>=1.2.0",
  "nomad-parser-plugins-database>=1.1.3",
  "nomad-baseclasses @ git+https://github.com/nomad-hzb/nomad-baseclasses.git@v1.0.1",
  "nomad-battery-space @ git+https://github.com/nomad-hzb/nomad-battery-space.git@v0.2.4_nomad2.0.0compatibility2",
]
jupyter = [
  "jupyter-events",
  "voila",
  "ipywidgets",
  "ipyaggrid",
  "ipyvuetify",
  "pyvis",
]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==2.0.0"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
override-dependencies = ["pyzmq; sys_platform == 'never'"] # to avoid concurrent installation in jupyter image
constraint-dependencies = ["hyperspy>=1.7.6", "flatdict>=4.1.0"]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
